name: CI

on: # trigger
  workflow_dispatch: # manual button to run this workflow

jobs:
  hello: # name of our job
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v7
      
      - name: Show environment
        run: |
          echo "Hello from GitHub Actions"
          uname -a
          pwd

      - name: List files
        run: ls -la

        
      - name: list contents of index.html
        run: cat src/index.html
