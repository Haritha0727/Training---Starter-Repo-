name: CI

on: # trigger
  workflow_dispatch: # manual button to run this workflow
  
  push:
    branches:
      - main
    paths:
      - 'src/**'
      
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Show trigger
        run: echo "Triggered by ${{ github.event_name }}"

      - name: Run tests
        run: echo "Tests passed"
          
      - name: Show environment
        run: |
          echo "Hello from GitHub Actions"
          uname -a
          pwd

      - name: List files
        run: ls -la

        
      - name: list contents of index.html
        run: cat src/index.html
